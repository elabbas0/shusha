# Built into the installed disk's BOOTX64.EFI (grub-mkstandalone).  The
# real menu is \BOOT\GRUB\GRUB.CFG on the EFI partition, which the
# installer writes (kernel/fs/store.c: boot flags, the SMBIOS UUID).
set timeout=0
insmod part_gpt
insmod fat
insmod search
insmod search_fs_file
insmod smbios
insmod all_video
insmod gfxterm
insmod configfile
search --file --set=root /BOOT/GRUB/GRUB.CFG
configfile /BOOT/GRUB/GRUB.CFG
