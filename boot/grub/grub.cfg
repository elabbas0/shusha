set timeout=0
set default=0
set gfxmode=auto
set gfxpayload=keep
# QEMU/Bochs VGA picks 800x600 for "auto"; ask virtual machines for a
# roomier mode.  Real hardware keeps "auto" (the GOP/native mode), which
# ICDA found to be the only mode some GPUs/monitors accept over HDMI.
insmod smbios
smbios --type 1 --get-string 4 --set shusha_vendor
if [ "$shusha_vendor" = "QEMU" ]; then
    set gfxmode=1280x800,1024x768,auto
fi
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "Shusha" {
    search --file --set=root /boot/kernel.bin
    multiboot2 /boot/kernel.bin icda.live=1
    # multiboot2 rewrites gfxpayload from the kernel's 0x0 framebuffer
    # request ("auto"); restore "keep" so the kernel gets GRUB's mode.
    set gfxpayload=keep
    boot
}
